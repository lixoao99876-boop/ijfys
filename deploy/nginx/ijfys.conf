# /etc/nginx/sites-available/ijfys.conf
# 部署：sudo ln -s /etc/nginx/sites-available/ijfys.conf /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx

# ---- 公网回源到 Next.js（3000）+ API 反代到 NestJS（4000）----

upstream ijfys_web {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream ijfys_api {
    server 127.0.0.1:4000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# 80 → 443 强跳
server {
    listen 80;
    listen [::]:80;
    server_name ijfys.com www.ijfys.com;
    return 301 https://$host$request_uri;
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ijfys.com www.ijfys.com;

    # ssl 证书（letsencrypt）
    ssl_certificate     /etc/letsencrypt/live/ijfys.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ijfys.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 10M;
    client_body_timeout 30s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;

    # gzip
    gzip on;
    gzip_min_length 1k;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml application/atom+xml image/svg+xml;
    gzip_vary on;

    # 拦截 admin 接口（仅运维 IP 白名单可访问，按需开启）
    # location /api/admin/ {
    #     allow 1.2.3.4;
    #     deny all;
    #     proxy_pass http://ijfys_api;
    # }

    # API
    location /api/ {
        proxy_pass http://ijfys_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sitemap / robots / rss 由 Next.js 输出
    location = /sitemap.xml { proxy_pass http://ijfys_web; }
    location = /robots.txt  { proxy_pass http://ijfys_web; }
    location = /rss.xml     { proxy_pass http://ijfys_web; }

    # Next.js 静态资源
    location /_next/static/ {
        proxy_pass http://ijfys_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js SSR 兜底
    location / {
        proxy_pass http://ijfys_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
